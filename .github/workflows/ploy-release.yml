# Builds Ploy's workerd (upstream release + Ploy patches) and runs the Worker Loader tests and a
# smoke test on every push to `ploy/main` and every pull request into it. Pushing a tag
# `v<upstream>-ploy.<n>` on a commit whose `ploy/main` build succeeded publishes that build's
# binaries as a GitHub release. The tag run does not rebuild: tag refs cannot read the branch's
# Bazel cache, so a rebuild would be cold.
#
# Runs on standard GitHub runners without Cloudflare's remote cache, so a cold build is slow. The
# Bazel disk cache is saved even when the build times out, so re-running the workflow resumes
# where the previous attempt stopped.
name: Ploy release

on:
  push:
    branches:
      - ploy/main
    tags:
      - 'v*-ploy.*'
  # Pull requests into ploy/main build and test too; their runs restore ploy/main's Bazel cache.
  pull_request:
    branches:
      - ploy/main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ploy-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_type != 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: linux-64
            runner: ubuntu-22.04
          - arch: linux-arm64
            runner: ubuntu-22.04-arm
    # Ubuntu 22.04 (glibc 2.35), like upstream: the binary must run on Debian 12 (glibc 2.36).
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          # Keep the Android SDK: rules_android fails analysis when ANDROID_HOME points nowhere.
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift || true
          sudo docker image prune --all --force || true
          df -h /
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Restore Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: ~/bazel-disk-cache
          key: ploy-bazel-jammy-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ploy-bazel-jammy-${{ matrix.arch }}-
      - name: Setup runner
        uses: ./.github/actions/setup-runner
        with:
          GOOGLESOURCE_COOKIE: ''
      - name: Build and test
        id: build
        timeout-minutes: 330
        run: |
          bazel test --config=ci --config=release_linux --strip=always \
            --build_tests_only=false --test_output=errors \
            //src/workerd/server:workerd \
            //src/workerd/api/tests:worker-loader-cpu-limit-test@ \
            //src/workerd/api/tests:worker-loader-limits-test@ \
            //src/workerd/api/tests:worker-loader-test@
      - name: Save Bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/bazel-disk-cache
          key: ploy-bazel-jammy-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Package binary
        run: |
          cp bazel-bin/src/workerd/server/workerd /tmp/workerd
          /tmp/workerd --version
          gzip -9N -c /tmp/workerd > /tmp/workerd-${{ matrix.arch }}.gz
      - name: Smoke test
        run: ./ploy/smoke-test/run.sh /tmp/workerd
      - name: Check glibc requirement
        run: |
          # Debian 12 ships glibc 2.36; anything newer would fail to start in Ploy's images.
          newest=$(objdump -T /tmp/workerd | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
          echo "newest glibc symbol: $newest"
          [ "$(printf '%s\nGLIBC_2.36\n' "$newest" | sort -V | tail -1)" = "GLIBC_2.36" ]
      - uses: actions/upload-artifact@v4
        with:
          name: workerd-${{ matrix.arch }}
          path: /tmp/workerd-${{ matrix.arch }}.gz
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Download the branch build of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ploy-release.yml \
            --branch ploy/main --commit "${GITHUB_SHA}" --status success \
            --json databaseId --jq '.[0].databaseId')
          if [ -z "${run_id}" ]; then
            echo "No successful ploy/main build for ${GITHUB_SHA}; push the commit to ploy/main first." >&2
            exit 1
          fi
          gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" --pattern 'workerd-*' --dir dist
          find dist -name 'workerd-*.gz' -exec mv {} dist/ \;
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          upstream="${tag%%-ploy.*}"
          cd dist
          sha256sum workerd-*.gz > SHA256SUMS
          cat SHA256SUMS
          gh release create "${tag}" workerd-*.gz SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${tag}" \
            --notes "workerd ${upstream} with Ploy's patches (${GITHUB_SHA}). See PLOY.md."
